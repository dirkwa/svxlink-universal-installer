name: lint

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # bash -n first: a syntax error makes shellcheck's own output noisy
      # and the ::error annotation here points at the exact file. Covers
      # .tmpl too — svx.tmpl / svx-recovery.tmpl are real bash scripts
      # that only get a version sed at install/Pages time.
      - name: bash -n syntax check
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n syntax error"
              fail=1
            fi
          done < <(find installer scripts -type f \( -name '*.sh' -o -name '*.tmpl' \) -print0)
          exit "$fail"

      # -x so shellcheck follows the `# shellcheck source=` directives into
      # installer/linux/lib/*.sh instead of flagging every sourced function
      # as unassigned.
      - name: shellcheck
        run: |
          set -euo pipefail
          find installer scripts -type f \( -name '*.sh' -o -name '*.tmpl' \) -print0 |
            xargs -0 shellcheck -x

      # Every scripts/test/check-*.sh is a self-contained pure-bash
      # contract test (no VM, no podman needed). The glob is deliberately
      # unguarded: if the tests directory ever goes missing, this step must
      # fail loudly, not silently pass an empty loop.
      - name: contract tests
        run: |
          set -euo pipefail
          for t in scripts/test/check-*.sh; do
            echo "==> $t"
            bash "$t"
          done
